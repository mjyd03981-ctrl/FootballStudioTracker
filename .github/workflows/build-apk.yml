
name: Build Football Studio Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract Android project
        shell: bash
        run: |
          mkdir -p extracted

          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            ARCHIVE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

            if [ -z "$ARCHIVE" ]; then
              echo "ERROR: No ZIP file found"
              exit 1
            fi

            echo "Found archive: $ARCHIVE"
            unzip -q "$ARCHIVE" -d extracted

            PROJECT_FILE=$(find extracted -name settings.gradle.kts -print -quit)

            if [ -z "$PROJECT_FILE" ]; then
              echo "ERROR: settings.gradle.kts not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PROJECT_FILE")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballStudioTracker-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
